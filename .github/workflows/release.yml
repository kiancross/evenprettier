name: Release

on:
  release:
    types: [published]

permissions: {}

# Two releases never publish at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

      # Lets npm's trusted publishing check that this workflow is publishing,
      # so that no npm token needs to be stored.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

          # A cache written by another workflow could change what is published.
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm publish
